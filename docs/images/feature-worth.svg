<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">Worth a look</title>
  <desc id="desc">Three sketches: the list of findings, the most serious first; one finding's reason and what you can do, with its MITRE ATT&amp;CK numbers; and a grid of ATT&amp;CK techniques with a few marked, as in a layer for the ATT&amp;CK Navigator.</desc>
  <style>
    .t { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .m { font-family: "Cascadia Mono", Consolas, Menlo, monospace; }
  </style>
  <rect x="1" y="1" width="1278" height="298" rx="20" fill="#0b0b0b" stroke="#262626" stroke-width="2"/>
  <g fill="#121212" stroke="#262626" stroke-width="1.5">
    <rect x="24" y="24" width="392" height="252" rx="14"/>
    <rect x="440" y="24" width="392" height="252" rx="14"/>
    <rect x="856" y="24" width="400" height="252" rx="14"/>
  </g>
  <g class="t" font-size="20" fill="#a9a9a9">
    <text x="44" y="62">Worth a look</text>
    <text x="460" y="62">Why, and what to do</text>
    <text x="876" y="62">MITRE ATT&amp;CK</text>
  </g>

  <!-- The findings, the most serious first -->
  <rect x="36" y="87" width="368" height="26" rx="6" fill="#1f1f1f"/>
  <circle cx="54" cy="100" r="6" fill="#ff5449"/>
  <circle cx="54" cy="126" r="6" fill="#f2b33d"/>
  <circle cx="54" cy="152" r="6" fill="#f2b33d"/>
