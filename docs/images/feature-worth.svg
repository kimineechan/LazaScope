    <rect x="72" y="122" width="190" height="8" rx="4"/>
    <rect x="72" y="148" width="240" height="8" rx="4"/>
    <rect x="72" y="174" width="170" height="8" rx="4"/>
    <rect x="72" y="200" width="200" height="8" rx="4"/>
    <rect x="72" y="226" width="150" height="8" rx="4"/>
    <rect x="72" y="252" width="180" height="8" rx="4"/>
  </g>

  <!-- One finding: the reason and what to do -->
  <rect x="460" y="80" width="210" height="12" rx="6" fill="#cfcfcf"/>
  <g class="t" font-size="18" fill="#a9a9a9">
    <text x="460" y="124">Why</text>
    <text x="460" y="194">What you can do</text>
  </g>
  <g fill="#2e2e2e">
    <rect x="460" y="134" width="340" height="8" rx="4"/>
    <rect x="460" y="150" width="328" height="8" rx="4"/>
    <rect x="460" y="166" width="240" height="8" rx="4"/>
    <rect x="460" y="204" width="330" height="8" rx="4"/>
    <rect x="460" y="220" width="200" height="8" rx="4"/>
  </g>
  <text class="m" x="460" y="258" font-size="18" fill="#f2b33d">T1036.005, T1547.001</text>

