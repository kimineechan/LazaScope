<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">What starts, what runs, what connects</title>
  <desc id="desc">Four sketches: the start-up list with one entry marked, the running programs as a family tree with one marked, connections from this PC to the internet with one marked, and files with their signatures checked, one of them unsigned.</desc>
  <style>
    .t { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>
  <rect x="1" y="1" width="1278" height="298" rx="20" fill="#0b0b0b" stroke="#262626" stroke-width="2"/>
  <g fill="#121212" stroke="#262626" stroke-width="1.5">
    <rect x="24" y="24" width="284" height="252" rx="14"/>
    <rect x="340" y="24" width="284" height="252" rx="14"/>
    <rect x="656" y="24" width="284" height="252" rx="14"/>
    <rect x="972" y="24" width="284" height="252" rx="14"/>
  </g>
  <g class="t" font-size="20" fill="#a9a9a9">
    <text x="44" y="62">Start-up</text>
    <text x="360" y="62">Running</text>
    <text x="676" y="62">Connections</text>
    <text x="992" y="62">Signatures</text>
  </g>

  <!-- Start-up: entries, one marked -->
  <rect x="34" y="171" width="264" height="26" rx="6" fill="#f2b33d" fill-opacity="0.08"/>
  <g fill="#3a3a3a">
    <rect x="44" y="94" width="12" height="12" rx="3"/>
    <rect x="44" y="122" width="12" height="12" rx="3"/>
    <rect x="44" y="150" width="12" height="12" rx="3"/>
    <rect x="44" y="178" width="12" height="12" rx="3" fill="#f2b33d"/>
    <rect x="44" y="206" width="12" height="12" rx="3"/>
    <rect x="44" y="234" width="12" height="12" rx="3"/>
  </g>
  <g fill="#2e2e2e">
    <rect x="66" y="96" width="150" height="8" rx="4"/>
    <rect x="66" y="124" width="120" height="8" rx="4"/>
    <rect x="66" y="152" width="176" height="8" rx="4"/>
    <rect x="66" y="180" width="96" height="8" rx="4" fill="#4a4a4a"/>
    <rect x="66" y="208" width="140" height="8" rx="4"/>
    <rect x="66" y="236" width="110" height="8" rx="4"/>
  </g>

