  <rect x="350" y="171" width="264" height="26" rx="6" fill="#f2b33d" fill-opacity="0.08"/>
  <g fill="none" stroke="#3a3a3a" stroke-width="1.5">
    <path d="M368 105V212H386M368 128H386"/>
    <path d="M392 133V184H410M392 156H410"/>
    <path d="M392 217V240H410"/>
  </g>
  <g fill="#5a5a5a">
    <circle cx="368" cy="100" r="4.5"/>
    <circle cx="392" cy="128" r="4.5"/>
    <circle cx="416" cy="156" r="4.5"/>
    <circle cx="416" cy="184" r="4.5" fill="#f2b33d"/>
    <circle cx="392" cy="212" r="4.5"/>
    <circle cx="416" cy="240" r="4.5"/>
  </g>
  <g fill="#2e2e2e">
    <rect x="380" y="96" width="150" height="8" rx="4"/>
    <rect x="404" y="124" width="130" height="8" rx="4"/>
    <rect x="428" y="152" width="100" height="8" rx="4"/>
    <rect x="428" y="180" width="88" height="8" rx="4" fill="#4a4a4a"/>
    <rect x="404" y="208" width="126" height="8" rx="4"/>
    <rect x="428" y="236" width="96" height="8" rx="4"/>
  </g>

  <!-- Connections: this PC to the internet, one marked -->
  <g fill="none" stroke="#3a3a3a" stroke-width="1.5">
    <path d="M700 100C800 100 796 142 896 142"/>
    <path d="M700 142C800 142 796 100 896 100"/>
    <path d="M700 226C800 226 796 184 896 184"/>
  </g>
  <path d="M700 184C800 184 796 226 896 226" fill="none" stroke="#f2b33d" stroke-width="2"/>
  <g fill="#5a5a5a">
    <circle cx="700" cy="100" r="6"/>
    <circle cx="700" cy="142" r="6"/>
    <circle cx="700" cy="184" r="6" fill="#f2b33d"/>
    <circle cx="700" cy="226" r="6"/>
    <circle cx="896" cy="100" r="6"/>
    <circle cx="896" cy="142" r="6"/>
    <circle cx="896" cy="184" r="6"/>
    <circle cx="896" cy="226" r="6" fill="#f2b33d"/>
