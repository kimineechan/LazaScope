  <g fill="#1d1d1d" stroke="#5a5a5a" stroke-width="1.5" stroke-linejoin="round">
    <path d="M1022 84h30l12 12v40h-42z"/>
    <path d="M1142 84h30l12 12v40h-42z"/>
    <path d="M1022 172h30l12 12v40h-42z"/>
    <path d="M1142 172h30l12 12v40h-42z"/>
  </g>
  <g fill="none" stroke="#5a5a5a" stroke-width="1.5">
    <path d="M1052 84v12h12M1172 84v12h12M1052 172v12h12M1172 172v12h12"/>
  </g>
  <g fill="#5fcb80">
    <circle cx="1062" cy="132" r="11"/>
    <circle cx="1182" cy="132" r="11"/>
    <circle cx="1062" cy="220" r="11"/>
  </g>
  <circle cx="1182" cy="220" r="11" fill="#f2b33d"/>
  <g fill="none" stroke="#0b0b0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1057 132l4 4 6-7M1177 132l4 4 6-7M1057 220l4 4 6-7"/>
  </g>
  <rect x="1180.75" y="213" width="2.5" height="8" rx="1" fill="#0b0b0b"/>
  <circle cx="1182" cy="225" r="1.6" fill="#0b0b0b"/>
  <g fill="#2e2e2e">
    <rect x="1016" y="150" width="54" height="6" rx="3"/>
    <rect x="1136" y="150" width="54" height="6" rx="3"/>
    <rect x="1016" y="238" width="54" height="6" rx="3"/>
    <rect x="1136" y="238" width="54" height="6" rx="3"/>
  </g>
</svg>
