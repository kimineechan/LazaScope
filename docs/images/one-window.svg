<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">One window instead of many</title>
  <desc id="desc">The answers Windows keeps in Task Manager, Windows Security, Event Viewer, Task Scheduler, Services, Resource Monitor, Registry Editor and Microsoft's Sysinternals tools, gathered into one LazaScope window.</desc>
