name: Feature request
description: Suggest an improvement to LazaScope.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: workflow
    attributes:
      label: What are you trying to find out about a PC?
      description: Describe the question this feature would answer, or the place in Windows you want read.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested behaviour
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
